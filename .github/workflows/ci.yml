name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco/jacoco.xml
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Not available to Dependabot or fork PRs; the scan is skipped there.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: backend/target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage
      - uses: actions/setup-java@v6
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Sonar's Java rules need the dependency jars to resolve Spring/JPA/Lombok types.
      - name: Resolve Java libraries
        id: java-libs
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: |
          ./mvnw -B -q dependency:build-classpath -DincludeScope=compile -Dmdep.pathSeparator=, -Dmdep.outputFile=main.cp
          ./mvnw -B -q dependency:build-classpath -DincludeScope=test -Dmdep.pathSeparator=, -Dmdep.outputFile=test.cp
          echo "main=$(cat main.cp)" >> "$GITHUB_OUTPUT"
          echo "test=$(cat test.cp)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.java.libraries=${{ steps.java-libs.outputs.main }}
            -Dsonar.java.test.libraries=${{ steps.java-libs.outputs.test }}

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are unavailable to forks and Dependabot, so skip those PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a single-user personal finance app
            (Spring Boot backend, React PWA frontend). Read CLAUDE.md and PLAN.md
            first; they define the conventions and design.

            Focus, in order:
            1. Correctness bugs and missing edge cases.
            2. Security: authentication/authorization gaps, leaking personal
               financial data, secrets committed to the repo, injection.
            3. Money handling: amounts must be integer minor units plus a
               currency code, never floating point.
            4. Flyway migrations: never edit an existing migration; the schema
               must match the JPA entities (ddl-auto=validate).
            5. Missing or weak tests for the changed behavior.

            Skip style nitpicks — SonarQube and the linters cover those.

            Before commenting, run `gh pr view --comments` and do not repeat
            points already raised in earlier reviews of this PR.

            Use inline comments for issues tied to specific lines. Finish with one
            short top-level comment via `gh pr comment`: a verdict and the most
            important findings. If there is nothing worth raising, say so in one line.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

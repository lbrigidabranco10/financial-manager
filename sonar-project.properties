sonar.organization=lbrigidabranco10
sonar.projectKey=lbrigidabranco10_financial-manager
sonar.projectName=financial-manager

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test-setup.ts
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Application entry points only bootstrap the framework; testing them means booting the whole app.
sonar.coverage.exclusions=backend/src/main/java/com/lbrigida/financialmanager/FinancialManagerApplication.java,frontend/src/main.tsx

# Fail the CI job when the quality gate fails.
sonar.qualitygate.wait=true
